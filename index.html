<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="日語50音與N5每日練習">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>日語50音｜每日練習</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#18202a;--muted:#697586;--line:#e5e7eb;--accent:#111827;--ok:#087443;--bad:#b42318;--soft:#eef2f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:78px}
button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto}.top{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.94);backdrop-filter:blur(10px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}.top h1{font-size:20px;margin:0}.top small{color:var(--muted)}
main{padding:14px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.hero{background:#111827;color:#fff;border-radius:20px;padding:18px}.hero .date{opacity:.75;font-size:13px}.hero h2{margin:6px 0 4px;font-size:24px}.hero p{margin:0;opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);border-radius:14px;padding:13px}.stat b{display:block;font-size:23px}.stat span{font-size:12px;color:var(--muted)}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:#111827;border-radius:99px;width:0}
.primary,.secondary,.danger{width:100%;padding:12px 14px;border-radius:12px;margin-top:8px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:var(--soft);color:var(--text)}.danger{background:#fef0f0;color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);font-size:12px;color:var(--muted)}
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.kana{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}.kana strong{font-size:25px;display:block}.kana small{color:var(--muted)}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;padding:9px 12px;border-radius:999px;background:#e9edf2}.tabs button.on{background:#111827;color:#fff}
.question{font-size:62px;text-align:center;font-weight:800;margin:16px 0 6px}.subquestion{text-align:center;color:var(--muted);margin-bottom:15px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{padding:14px;border:1px solid var(--line);background:#fff;border-radius:13px;min-height:50px}.opt.correct{background:#e9f7ef;border-color:#73c69a;color:var(--ok)}.opt.wrong{background:#fff0f0;border-color:#e59a9a;color:var(--bad)}
.feedback{min-height:24px;text-align:center;font-weight:700;margin:12px 0}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.input:focus{border-color:#111827}
.word-big{text-align:center;font-size:36px;font-weight:800}.reading{text-align:center;color:var(--muted);font-size:18px}.meaning{text-align:center;font-size:20px;margin:8px 0}.example{background:var(--soft);padding:12px;border-radius:12px;margin-top:10px}.example b{font-size:18px}
.listitem{padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.bottom .nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{background:none;color:#687385;padding:7px 3px;border-radius:10px;font-size:12px}.nav button.on{background:#eef1f4;color:#111827;font-weight:700}.nav .ico{font-size:19px;display:block;margin-bottom:1px}
.canvas-wrap{display:flex;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}.draw{width:280px;height:280px;touch-action:none;background:#fff;border-radius:8px}
.note{color:var(--muted);font-size:13px;line-height:1.55}.empty{color:var(--muted);text-align:center;padding:18px}
@media(max-width:390px){.question{font-size:54px}.kana-grid{gap:5px}.kana{padding:8px 2px}.kana strong{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>日語 50 音 <span style="font-size:12px;color:#697586;font-weight:600">v3.2</span></h1><small id="topSub">每天 20 題，從假名到 N5</small></header>
<main>
<section id="home" class="view active"></section>
<section id="kanaView" class="view"></section>
<section id="practiceView" class="view"></section>
<section id="wordsView" class="view"></section>
</main>
<nav class="bottom"><div class="nav">
<button data-view="home" class="on"><span class="ico">⌂</span>首頁</button>
<button data-view="kanaView"><span class="ico">あ</span>50音</button>
<button data-view="practiceView"><span class="ico">✓</span>練習</button>
<button data-view="wordsView"><span class="ico">文</span>單字</button>
</div></nav>
</div>
<script>
const kana = [
["あ","ア","a"],["い","イ","i"],["う","ウ","u"],["え","エ","e"],["お","オ","o"],
["か","カ","ka"],["き","キ","ki"],["く","ク","ku"],["け","ケ","ke"],["こ","コ","ko"],
["さ","サ","sa"],["し","シ","shi"],["す","ス","su"],["せ","セ","se"],["そ","ソ","so"],
["た","タ","ta"],["ち","チ","chi"],["つ","ツ","tsu"],["て","テ","te"],["と","ト","to"],
["な","ナ","na"],["に","ニ","ni"],["ぬ","ヌ","nu"],["ね","ネ","ne"],["の","ノ","no"],
["は","ハ","ha"],["ひ","ヒ","hi"],["ふ","フ","fu"],["へ","ヘ","he"],["ほ","ホ","ho"],
["ま","マ","ma"],["み","ミ","mi"],["む","ム","mu"],["め","メ","me"],["も","モ","mo"],
["や","ヤ","ya"],["ゆ","ユ","yu"],["よ","ヨ","yo"],
["ら","ラ","ra"],["り","リ","ri"],["る","ル","ru"],["れ","レ","re"],["ろ","ロ","ro"],
["わ","ワ","wa"],["を","ヲ","wo"],["ん","ン","n"]
];
const words = [
["あさ","朝","早上","あさは やすいです。","早上很便宜。"],
["ひる","昼","中午","ひるに ごはんを たべます。","中午吃飯。"],
["よる","夜","晚上","よるは うちに います。","晚上在家。"],
["みず","水","水","みずを のみます。","喝水。"],
["おちゃ","お茶","茶","おちゃを ください。","請給我茶。"],
["ごはん","ご飯","飯、餐","ごはんを たべます。","吃飯。"],
["ねこ","猫","貓","ねこが います。","有一隻貓。"],
["いぬ","犬","狗","いぬが すきです。","喜歡狗。"],
["ほん","本","書","ほんを よみます。","讀書。"],
["がくせい","学生","學生","わたしは がくせいです。","我是學生。"],
["せんせい","先生","老師","せんせいは どこですか。","老師在哪裡？"],
["がっこう","学校","學校","がっこうへ いきます。","去學校。"],
["びょういん","病院","醫院","びょういんへ いきます。","去醫院。"],
["としょかん","図書館","圖書館","としょかんで ほんを よみます。","在圖書館讀書。"],
["くるま","車","車子","くるまが あります。","有車子。"],
["でんしゃ","電車","電車","でんしゃで いきます。","搭電車去。"],
["えき","駅","車站","えきは どこですか。","車站在哪裡？"],
["うち","家","家","うちへ かえります。","回家。"],
["ともだち","友達","朋友","ともだちと はなします。","和朋友聊天。"],
["せんしゅう","先週","上週","せんしゅう いそがしかったです。","上週很忙。"],
["きょう","今日","今天","きょうは げつようびです。","今天是星期一。"],
["あした","明日","明天","あした いきます。","明天去。"],
["きのう","昨日","昨天","きのう べんきょうしました。","昨天讀書了。"],
["おおきい","大きい","大的","おおきい いえです。","是大房子。"],
["ちいさい","小さい","小的","ちいさい ねこです。","是小貓。"],
["たべる","食べる","吃","パンを たべます。","吃麵包。"],
["のむ","飲む","喝","みずを のみます。","喝水。"],
["みる","見る","看","テレビを みます。","看電視。"],
["きく","聞く","聽、問","おんがくを ききます。","聽音樂。"],
["よむ","読む","讀","ほんを よみます。","讀書。"],
["かく","書く","寫","なまえを かきます。","寫名字。"],
["いく","行く","去","がっこうへ いきます。","去學校。"],
["くる","来る","來","ともだちが きます。","朋友會來。"],
["かえる","帰る","回去","うちへ かえります。","回家。"],
["すき","好き","喜歡","ねこが すきです。","喜歡貓。"],
["きらい","嫌い","討厭、不喜歡","さかなが きらいです。","不喜歡魚。"],
["いい","良い","好","これは いいです。","這個很好。"],
["わるい","悪い","不好、壞","きょうは てんきが わるいです。","今天天氣不好。"],
["あつい","暑い","熱的","きょうは あついです。","今天很熱。"],
["さむい","寒い","冷的","あさは さむいです。","早上很冷。"],
["おいしい","美味しい","好吃","この りょうりは おいしいです。","這道菜很好吃。"],
["たかい","高い","高、貴","この ほんは たかいです。","這本書很貴。"],
["やすい","安い","便宜","この みずは やすいです。","這水很便宜。"],
["あたらしい","新しい","新的","あたらしい くるまです。","是新車。"],
["ふるい","古い","舊的","ふるい ほんです。","是舊書。"],
["はやい","早い","早、快","あさは はやいです。","早上很早。"],
["おそい","遅い","晚、慢","でんしゃが おそいです。","電車很慢。"],
["しごと","仕事","工作","しごとへ いきます。","去工作。"],
["やすみ","休み","休假、休息","あしたは やすみです。","明天放假。"],
["じかん","時間","時間","じかんが ありません。","沒有時間。"],
["おかね","お金","錢","おかねが ありません。","沒有錢。"],
["てんき","天気","天氣","てんきが いいです。","天氣很好。"],
["でんわ","電話","電話","でんわを します。","打電話。"],
["なまえ","名前","名字","なまえは なんですか。","名字是什麼？"],
["にほん","日本","日本","にほんへ いきたいです。","想去日本。"],
["にほんご","日本語","日文","にほんごを べんきょうします。","學日文。"],
["えいご","英語","英文","えいごを はなします。","說英文。"],
["せいかつ","生活","生活","にほんの せいかつです。","日本的生活。"],
["しゃしん","写真","照片","しゃしんを とります。","拍照。"]
];
const grammar = [
["は","主題助詞","わたしは がくせいです。","我是學生。","は標示句子的主題。"],
["が","主語助詞","ねこが います。","有貓。","が常用來標示主語，特別是新出現的資訊。"],
["を","受詞助詞","みずを のみます。","喝水。","を標示動作直接作用的對象。"],
["に","時間／目的地","がっこうに いきます。","去學校。","に可表示到達的目的地，也可表示時間點。"],
["へ","方向","にほんへ いきます。","去日本。","へ表示移動方向，讀作 え。"],
["で","動作場所","としょかんで よみます。","在圖書館讀。","で表示動作發生的場所。"],
["の","所屬","わたしの ほんです。","是我的書。","の連接名詞，常表示所屬或修飾。"],
["も","也","わたしも がくせいです。","我也是學生。","も表示「也」。"],
["です","判斷","これは ほんです。","這是書。","です放在句尾，表示禮貌的判斷。"],
["ください","請給我／請…","みずを ください。","請給我水。","名詞＋を＋ください可用來禮貌索取。"]
];

const key="jp50_v3";
let state=JSON.parse(localStorage.getItem(key)||"null")||{
date:"",dailyDone:0,dailyCorrect:0,streak:0,lastStudy:"",
totalQ:0,totalCorrect:0,wrong:[],learnedWords:[],settings:{voice:true}
};
function save(){localStorage.setItem(key,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function dayIndex(){return Math.floor(Date.now()/86400000)}
function hash(n){let x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}
function dailyWord(){return words[dayIndex()%words.length]}
function speak(t){if(!state.settings.voice)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function setupDay(){let d=today();if(state.date!==d){state.date=d;state.dailyDone=0;state.dailyCorrect=0; if(state.lastStudy){let a=new Date(state.lastStudy),b=new Date(d);let diff=Math.round((b-a)/86400000);if(diff===1)state.streak++;else if(diff>1)state.streak=1}else state.streak=1;save()}}
setupDay();

function renderHome(){
 const w=dailyWord(), pct=Math.min(100,state.dailyDone/20*100);
 document.getElementById("home").innerHTML=`
 <div class="hero"><div class="date">${today()}　今日學習　｜　v3.2</div><h2>每天 10～15 分鐘</h2><p>假名 → 發音 → 單字 → 簡單文法</p></div>
 <div class="card"><div class="row"><div><b>今日進度</b><div class="note">${state.dailyDone} / 20 題</div></div><span class="pill">${Math.round(pct)}%</span></div><div class="progress"><i style="width:${pct}%"></i></div><button class="primary" onclick="startDaily()">開始今日 20 題</button></div>
 <div class="grid2"><div class="stat"><b>${state.dailyCorrect}</b><span>今日答對</span></div><div class="stat"><b>${state.streak}</b><span>連續學習天數</span></div><div class="stat"><b>${state.totalCorrect}</b><span>累積答對</span></div><div class="stat"><b>${state.wrong.length}</b><span>待複習錯題</span></div></div>
 <div class="card"><span class="pill">今日單字</span><div class="word-big">${w[1]}</div><div class="reading">${w[0]}</div><div class="meaning">${w[2]}</div><div class="example"><b>${w[3]}</b><br>${w[4]}</div><button class="secondary" onclick="speak('${w[3].replaceAll("'","")}')">🔊 聽例句</button></div>
 <div class="card"><b>今天學什麼？</b><div class="note" style="margin-top:7px">每天會依日期自動換一組單字、例句與練習題。資料存在你的手機瀏覽器，不需要登入。</div></div>
 `;
}
function renderKana(){
 let mode=window.kanaMode||"h";
 let title=mode==="h"?"平假名":"片假名";
 let cells=kana.map(k=>`<button class="kana" onclick="speak('${k[0]}')"><strong>${mode==="h"?k[0]:k[1]}</strong><small>${k[2]}</small></button>`).join("");
 document.getElementById("kanaView").innerHTML=`<div class="tabs"><button class="${mode==="h"?"on":""}" onclick="window.kanaMode='h';renderKana()">平假名</button><button class="${mode==="k"?"on":""}" onclick="window.kanaMode='k';renderKana()">片假名</button></div><div class="card"><b>${title}表</b><p class="note">點假名即可播放日文發音。</p><div class="kana-grid">${cells}</div></div><div class="card"><b>書寫練習</b><p class="note">選一個假名後，在框內照著寫。這裡先練手感，不做筆順判定。</p><div class="row"><select id="drawKana" class="input">${kana.map(k=>`<option value="${k[0]}">${k[0]} / ${k[2]}</option>`).join("")}</select><button class="secondary" onclick="speak(document.getElementById('drawKana').value)">🔊</button></div><div class="canvas-wrap"><canvas id="draw" class="draw" width="560" height="560"></canvas></div><div class="row"><button class="secondary" onclick="clearCanvas()">清除</button><button class="secondary" onclick="showDrawAnswer()">看答案</button></div><div id="drawAns" class="feedback"></div></div>`;
 setTimeout(initCanvas,0);
}
function initCanvas(){
 const c=document.getElementById("draw"); if(!c)return; const ctx=c.getContext("2d");ctx.lineWidth=12;ctx.lineCap="round";ctx.lineJoin="round";
 let down=false;
 const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]};
 const start=e=>{e.preventDefault();down=true;let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};
 const move=e=>{if(!down)return;e.preventDefault();let [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
 const end=()=>down=false;
 c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end;
}
function clearCanvas(){let c=document.getElementById("draw");if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);document.getElementById("drawAns").textContent=""}
function showDrawAnswer(){let k=document.getElementById("drawKana").value;document.getElementById("drawAns").textContent=`答案：${k}（${kana.find(x=>x[0]===k)[2]}）`;speak(k)}

let practice={type:"romaji",idx:0,score:0,answered:false,items:[],daily:false};
function shuffle(a,seed=1){return [...a].sort((x,y)=>hash(seed+(x[0]?.charCodeAt(0)||0))-.5)}
function makeDaily(){
 let items=[];
 for(let i=0;i<20;i++){let kind=i%5;let idx=(dayIndex()*7+i*13)%kana.length;items.push({kind,k: kana[idx]})}
 return items;
}
function startDaily(){practice={type:"daily",idx:0,score:0,answered:false,items:shuffle(makeDaily(),Date.now()),daily:true};showView("practiceView");renderPractice()}
function startPractice(type){let items;if(type==="romaji")items=kana.map((k,i)=>({kind:0,k}));else if(type==="convert")items=kana.map((k,i)=>({kind:1,k}));else if(type==="listen")items=kana.map((k,i)=>({kind:2,k}));else if(type==="word")items=words.map((w,i)=>({kind:3,w}));else items=grammar.map((g,i)=>({kind:4,g}));practice={type,idx:0,score:0,answered:false,items:shuffle(items,dayIndex())};showView("practiceView");renderPractice()}
function addResult(correct,item){
 state.totalQ++; if(correct)state.totalCorrect++;
 if(practice.daily){state.dailyDone=Math.min(20,state.dailyDone+1);if(correct)state.dailyCorrect++}
 if(!correct){let id=item.kind+":"+(item.k?.[0]||item.w?.[0]||item.g?.[0]||"");if(!state.wrong.includes(id))state.wrong.push(id)}
 state.lastStudy=today();save()
}
function optionSet(correct,arr){let pool=shuffle(arr,dayIndex()+practice.idx*31);let out=[];for(const x of pool){if(JSON.stringify(x)!==JSON.stringify(correct)&&out.length<3)out.push(x)}return shuffle([correct,...out],dayIndex()+practice.idx*17)}
function renderPractice(){
 let item=practice.items[practice.idx];
 if(!item){renderPracticeDone();return}
 let title=practice.daily?`今日 20 題　${practice.idx+1}/20`:(practice.type==="romaji"?"羅馬拼音":practice.type==="convert"?"假名轉換":practice.type==="listen"?"聽力":"單字／文法");
 let body="";
 if(item.kind===0){body=`<div class="question">${item.k[0]}</div><div class="subquestion">請輸入羅馬拼音</div><input id="ans" class="input" autocomplete="off" autocapitalize="none" placeholder="例如：shi"><button class="primary" onclick="checkRomaji()">確認</button>`}
 if(item.kind===1){let dir=practice.idx%2===0?"平假名 → 片假名":"片假名 → 平假名";let q=dir.startsWith("平")?item.k[0]:item.k[1];let correct=dir.startsWith("平")?item.k[1]:item.k[0];let opts=optionSet(correct,kana.map(k=>dir.startsWith("平")?k[1]:k[0]));body=`<div class="question">${q}</div><div class="subquestion">${dir}</div><div class="options">${opts.map(x=>`<button class="opt" onclick="choose('${x}','${correct}')">${x}</button>`).join("")}</div>`}
 if(item.kind===2){body=`<div class="question">?</div><div class="subquestion">先聽發音，再選出假名</div><button class="secondary" onclick="speak('${item.k[0]}')">🔊 播放</button><div class="options" style="margin-top:10px">${optionSet(item.k[0],kana.map(k=>k[0])).map(x=>`<button class="opt" onclick="choose('${x}','${item.k[0]}')">${x}</button>`).join("")}</div>`}
 if(item.kind===3){let correct=item.w[2],opts=optionSet(correct,words.map(w=>w[2]));body=`<div class="question" style="font-size:44px">${item.w[1]}</div><div class="subquestion">${item.w[0]}</div><div class="options">${opts.map(x=>`<button class="opt" onclick="choose('${x.replaceAll("'","")}','${correct.replaceAll("'","")}')">${x}</button>`).join("")}</div>`}
 if(item.kind===4){let correct=item.g[0],opts=optionSet(correct,grammar.map(g=>g[0]));body=`<div class="question" style="font-size:44px">＿</div><div class="subquestion">${item.g[2]}<br>${item.g[3]}<br><span class="pill">請選助詞</span></div><div class="options">${opts.map(x=>`<button class="opt" onclick="choose('${x}','${correct}')">${x}</button>`).join("")}</div>`}
 document.getElementById("practiceView").innerHTML=`<div class="card"><div class="row"><b>${title}</b><span class="pill">答對 ${practice.score}</span></div>${body}<div id="feedback" class="feedback"></div><button id="nextBtn" class="secondary" style="display:none" onclick="nextPractice()">下一題</button></div>`;
 if(item.kind===0)setTimeout(()=>document.getElementById("ans")?.focus(),50);
}
function checkRomaji(){let item=practice.items[practice.idx],ans=(document.getElementById("ans").value||"").trim().toLowerCase(),correct=ans===item.k[2];finishQuestion(correct,item)}
function choose(ans,correct){let item=practice.items[practice.idx];finishQuestion(ans===correct,item)}
function finishQuestion(correct,item){
 if(practice.answered)return;practice.answered=true;if(correct)practice.score++;
 addResult(correct,item);
 let f=document.getElementById("feedback");f.textContent=correct?"答對":"再試一次，答案是："+(item.k?item.k[2]:item.w?item.w[2]:item.g?item.g[0]:"");f.style.color=correct?"var(--ok)":"var(--bad)";
 document.querySelectorAll(".opt").forEach(b=>{if(b.textContent.trim()===(item.k?(item.kind===1?(practice.idx%2===0?item.k[1]:item.k[0]):item.k[0]):item.w?item.w[2]:item.g[0]))b.classList.add("correct")});
 document.getElementById("nextBtn").style.display="block";
}
function nextPractice(){practice.idx++;practice.answered=false;renderPractice()}
function renderPracticeDone(){document.getElementById("practiceView").innerHTML=`<div class="card" style="text-align:center"><div class="question" style="font-size:44px">完成</div><p>本次答對 <b>${practice.score}</b> / ${practice.items.length}</p>${practice.daily?`<p>今天進度：${state.dailyDone}/20</p>`:""}<button class="primary" onclick="startDaily()">再做一次今日練習</button><button class="secondary" onclick="showView('home')">回首頁</button></div>`;renderHome()}
function renderWords(){
 let w=dailyWord();document.getElementById("wordsView").innerHTML=`<div class="tabs"><button class="on">今日</button><button onclick="startPractice('word')">單字測驗</button><button onclick="startPractice('grammar')">文法測驗</button></div><div class="card"><span class="pill">每日單字</span><div class="word-big">${w[1]}</div><div class="reading">${w[0]}</div><div class="meaning">${w[2]}</div><div class="example"><b>${w[3]}</b><br>${w[4]}</div><button class="secondary" onclick="speak('${w[0]}')">🔊 聽單字</button><button class="secondary" onclick="speak('${w[3].replaceAll("'","")}')">🔊 聽例句</button></div><div class="card"><b>今日文法</b><div class="listitem"><b>${grammar[dayIndex()%grammar.length][0]}</b>　${grammar[dayIndex()%grammar.length][1]}<br>${grammar[dayIndex()%grammar.length][2]}<br><span class="note">${grammar[dayIndex()%grammar.length][4]}</span></div></div><div class="card"><b>N5 單字庫</b>${words.slice(0,30).map(w=>`<div class="listitem"><b>${w[1]}</b>　${w[0]}　<span class="note">${w[2]}</span><button class="secondary" onclick="speak('${w[0]}')">🔊</button></div>`).join("")}</div><div class="card"><b>錯題複習</b><p class="note">答錯的題目會保留在這台裝置，之後可重新練習。</p><button class="primary" onclick="reviewWrong()">開始錯題複習（${state.wrong.length}）</button></div><div class="card"><button class="danger" onclick="resetAll()">清除本機學習紀錄</button></div>`}
function reviewWrong(){if(!state.wrong.length){alert("目前沒有錯題。");return}let items=[];for(let id of state.wrong){let [kind,key]=id.split(":");if(kind==="0"||kind==="1"||kind==="2"){let k=kana.find(x=>x[0]===key);if(k)items.push({kind:+kind,k})}else if(kind==="3"){let w=words.find(x=>x[0]===key);if(w)items.push({kind:3,w})}else{let g=grammar.find(x=>x[0]===key);if(g)items.push({kind:4,g})}}if(!items.length){alert("錯題資料已不存在。");return}practice={type:"review",idx:0,score:0,answered:false,items};showView("practiceView");renderPractice()}
function resetAll(){if(confirm("確定要清除所有學習紀錄嗎？")){localStorage.removeItem(key);location.reload()}}
function showView(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===id));if(id==="home")renderHome();if(id==="kanaView")renderKana();if(id==="wordsView")renderWords();if(id==="practiceView"&&!practice.items.length)startDaily()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
 if(b.dataset.view==="practiceView"){startDaily();return}
 showView(b.dataset.view)
});
renderHome();renderKana();renderWords();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
